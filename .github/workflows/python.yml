name: Python package

on:
  push:
    paths:
      - "pyprtLab/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "pyprtLab/**"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    defaults:
      run:
        working-directory: pyprtLab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyprtLab/pyproject.toml

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples tools

      - name: Test
        run: pytest -q

      - name: Validate notebook sources
        run: python tools/validate_notebooks.py

      - name: Execute notebooks
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: python tools/validate_notebooks.py --execute

      - name: Build and smoke-test wheel
        run: python tools/smoke_test_wheel.py
