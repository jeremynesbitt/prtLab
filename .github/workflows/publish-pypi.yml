name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyprtLab

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyprtLab/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import runpy

          from packaging.version import Version

          package_version = runpy.run_path(
              "src/prtlab/_version.py"
          )["__version__"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if Version(tag_version) != Version(package_version):
              raise SystemExit(
                  f"Release tag {tag_version!r} does not match "
                  f"package version {package_version!r}."
              )
          print(f"Release version verified: {package_version}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: pyprtLab/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prtLab
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
